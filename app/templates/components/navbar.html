{% block navbar %}
<nav class="bg-primary py-3 px-4 d-flex justify-content-between">
     <h2 class="fs-4 text-white">Placement portal</h2>
     {% if current_user.is_authenticated %}
          <a href="{{ url_for('auth.logout') }}" class="btn btn-light px-3" >Log Out</a>
     {% else %}
     <div>
          <a href="{{ url_for('auth.login') }}" class="btn btn-light px-3">Login</a>
          <a href="{{ url_for('auth.register_student') }}" class="btn btn-secondary px-3">Register</a>
     </div>
     {% endif %}
</nav>
{% endblock %}
