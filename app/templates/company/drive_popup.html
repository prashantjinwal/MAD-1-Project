{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">

            <h3 class="mb-4 text-primary">
                Create Placement Drive
            </h3>

            <form method="POST">

                <!-- Job Title -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Job Title
                    </label>
                    <input type="text"
                           name="job_title"
                           class="form-control"
                           placeholder="e.g. Software Developer"
                           required>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Job Description
                    </label>
                    <textarea name="description"
                              class="form-control"
                              rows="4"
                              placeholder="Enter job details..."></textarea>
                </div>

                <!-- Elig -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Eligibility Criteria
                    </label>
                    <input type="text"
                           name="eligibility"
                           class="form-control"
                           placeholder="e.g. CSE/IT, CGPA 7+">
                </div>

                <!-- Deadline -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Application Deadline
                    </label>
                    <input type="date"
                           name="deadline"
                           class="form-control"
                           required>
                </div>

                <!-- butn -->
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('company.c_company') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary px-4">
                        Create Drive
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
